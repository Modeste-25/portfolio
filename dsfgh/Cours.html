<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoursEnLigne | De la 6ème à la Licence 3</title>
  <meta name="description"
    content="Tous les cours de la 6ème à la Terminale (toutes séries) et de la Licence 1 à la Licence 3 (toutes filières). Inscris-toi et suis ta progression." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --board: #123B33;
      --board-2: #1A4A40;
      --chalk: #F6F7F2;
      --yellow: #F6D55C;
      --bg: #F4F6F5;
      --surface: #fff;
      --ink: #14201D;
      --muted: #586763;
      --line: #DCE3E0;
      --col: #2459D6;
      --lyc: #B84A14;
      --uni: #6D3FD6;
      --ok: #12805C;
      --err: #C0261B;
      --f: 'Lexend', 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: var(--f);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden
    }

    button {
      font-family: inherit;
      cursor: pointer;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
      border-radius: 8px
    }

    .wrap {
      width: min(1180px, 100% - 40px);
      margin-inline: auto
    }

    /* Header */
    header.top {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--board);
      color: var(--chalk);
      border-bottom: 1px solid rgba(255, 255, 255, .08)
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 18px;
      height: 70px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      text-decoration: none;
      color: var(--chalk);
      cursor: pointer;
      background: none;
      border: none
    }

    .logo i {
      background: var(--yellow);
      color: var(--board);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 1rem
    }

    .search {
      flex: 1;
      max-width: 560px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border-radius: 999px;
      padding: 0 18px;
      height: 44px;
      color: var(--ink)
    }

    .search i {
      color: var(--muted)
    }

    .search input {
      border: none;
      outline: none;
      width: 100%;
      font: 400 .98rem var(--f);
      background: none
    }

    .mine {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid rgba(255, 255, 255, .35);
      background: none;
      color: var(--chalk);
      border-radius: 999px;
      padding: 9px 18px;
      font-weight: 500;
      font-size: .95rem
    }

    .mine:hover {
      background: rgba(255, 255, 255, .1)
    }

    .mine b {
      background: var(--yellow);
      color: var(--board);
      border-radius: 99px;
      min-width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      font-size: .8rem;
      padding: 0 6px
    }

    /* Hero */
    .hero {
      background: var(--board);
      color: var(--chalk);
      padding: 60px 0 120px
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5.4vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -.02em;
      max-width: 18ch;
      margin-bottom: 18px
    }

    .hero h1 em {
      font-style: normal;
      color: var(--yellow)
    }

    .hero p {
      color: #BFD0CA;
      font-size: 1.12rem;
      max-width: 56ch
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 34px;
      margin-top: 30px;
      color: #BFD0CA
    }

    .stats b {
      display: block;
      color: var(--chalk);
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.1
    }

    .cycles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: -76px;
      position: relative
    }

    .cy {
      background: var(--surface);
      border: none;
      border-radius: 22px;
      padding: 28px;
      text-align: left;
      box-shadow: 0 14px 34px rgba(18, 59, 51, .16);
      display: grid;
      gap: 10px;
      transition: transform .25s;
      border-top: 6px solid var(--c)
    }

    .cy:hover {
      transform: translateY(-6px)
    }

    .cy .ic {
      width: 54px;
      height: 54px;
      border-radius: 15px;
      background: var(--c);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.4rem
    }

    .cy h2 {
      font-size: 1.5rem;
      font-weight: 700
    }

    .cy p {
      color: var(--muted);
      font-size: .95rem
    }

    .cy .go {
      color: var(--c);
      font-weight: 600;
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px
    }

    main {
      padding: 40px 0 90px;
      min-height: 60vh
    }

    .how {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 56px
    }

    .how div {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px
    }

    .how i {
      color: var(--board);
      background: #E3EFEA;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      margin-bottom: 12px
    }

    .how h3 {
      font-size: 1.05rem;
      margin-bottom: 4px
    }

    .how p {
      color: var(--muted);
      font-size: .93rem
    }

    /* Navigation */
    .crumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: .92rem;
      color: var(--muted);
      margin-bottom: 22px
    }

    .crumbs button {
      background: none;
      border: none;
      color: var(--muted);
      text-decoration: underline;
      font-size: inherit
    }

    .crumbs button:hover {
      color: var(--ink)
    }

    .crumbs b {
      color: var(--ink);
      font-weight: 600
    }

    .vh {
      margin-bottom: 26px
    }

    .vh h2 {
      font-size: clamp(1.7rem, 3.6vw, 2.4rem);
      font-weight: 700;
      line-height: 1.15
    }

    .vh p {
      color: var(--muted);
      margin-top: 6px
    }

    h3.step {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 30px 0 14px
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px
    }

    .pill {
      border: 2px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      padding: 14px 26px;
      font-weight: 600;
      font-size: 1.02rem;
      transition: .2s
    }

    .pill:hover {
      border-color: var(--c)
    }

    .pill.on {
      background: var(--c);
      border-color: var(--c);
      color: #fff
    }

    .grp {
      margin-bottom: 14px
    }

    .grp small {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
      font-size: .9rem
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px
    }

    .chip {
      border: 2px solid var(--line);
      background: var(--surface);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 500;
      font-size: .95rem;
      text-align: left
    }

    .chip:hover {
      border-color: var(--c)
    }

    .chip.on {
      background: var(--c);
      border-color: var(--c);
      color: #fff
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px
    }

    .course {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      text-align: left;
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 6px 14px;
      align-items: center;
      transition: transform .2s, border-color .2s
    }

    .course:hover {
      transform: translateY(-4px);
      border-color: var(--c)
    }

    .course .ic {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--c) 14%, #fff);
      color: var(--c);
      display: grid;
      place-items: center;
      font-size: 1.25rem
    }

    .course b {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.3;
      display: block
    }

    .course small {
      color: var(--muted);
      font-size: .85rem
    }

    .course .pg {
      grid-column: 1/-1;
      margin-top: 8px
    }

    .bar-p {
      height: 7px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden
    }

    .bar-p i {
      display: block;
      height: 100%;
      background: var(--ok);
      border-radius: 99px
    }

    .tick {
      color: var(--ok);
      font-size: .8rem;
      font-weight: 600
    }

    .fil {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      text-align: left;
      display: flex;
      gap: 14px;
      align-items: center;
      transition: .2s
    }

    .fil:hover {
      border-color: var(--c);
      transform: translateY(-3px)
    }

    .fil .ic {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 12px;
      background: var(--c);
      color: #fff;
      display: grid;
      place-items: center
    }

    .fil b {
      font-weight: 600;
      font-size: .98rem;
      line-height: 1.3
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 0
    }

    .count {
      color: var(--muted);
      margin-bottom: 16px;
      font-size: .95rem
    }

    /* Panneau */
    .veil {
      position: fixed;
      inset: 0;
      background: rgba(10, 26, 22, .55);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 50
    }

    .veil.on {
      opacity: 1;
      pointer-events: auto
    }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(480px, 100%);
      background: var(--surface);
      z-index: 60;
      transform: translateX(100%);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1);
      display: flex;
      flex-direction: column
    }

    .panel.on {
      transform: none
    }

    .ph {
      padding: 24px 26px;
      background: var(--c, var(--board));
      color: #fff;
      position: relative
    }

    .ph small {
      opacity: .85
    }

    .ph h2 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
      margin: 4px 40px 0 0
    }

    .close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, .2);
      color: #fff;
      font-size: 1rem
    }

    .pb {
      flex: 1;
      overflow: auto;
      padding: 22px 26px
    }

    .pb h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 10px
    }

    .pgl {
      display: flex;
      justify-content: space-between;
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 6px
    }

    .chl {
      list-style: none;
      margin: 18px 0
    }

    .chl li {
      border-bottom: 1px solid var(--line)
    }

    .chl label {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 13px 2px;
      cursor: pointer
    }

    .chl input {
      appearance: none;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 7px;
      border: 2px solid #B7C4BF;
      margin-top: 2px;
      display: grid;
      place-items: center;
      cursor: pointer
    }

    .chl input:checked {
      background: var(--ok);
      border-color: var(--ok)
    }

    .chl input:checked::after {
      content: "\f00c";
      font: 900 .7rem "Font Awesome 6 Free";
      color: #fff
    }

    .chl input:checked+span {
      color: var(--muted);
      text-decoration: line-through
    }

    .pf {
      padding: 18px 26px;
      border-top: 1px solid var(--line)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--board);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font: 600 1rem var(--f);
      width: 100%;
      transition: transform .2s
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .btn.done {
      background: #E3F4EC;
      color: var(--ok);
      cursor: default;
      transform: none
    }

    .btn.ghost {
      background: none;
      color: var(--muted);
      border: 1px solid var(--line);
      width: auto
    }

    .mi {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      align-items: center
    }

    .mi b {
      font-weight: 600
    }

    .mi small {
      color: var(--muted)
    }

    .mi button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: .9rem
    }

    .mi .bar-p {
      grid-column: 1/-1
    }

    dialog {
      border: none;
      border-radius: 24px;
      padding: 0;
      width: min(480px, calc(100% - 28px));
      box-shadow: 0 30px 80px rgba(10, 26, 22, .4);
      color: var(--ink)
    }

    dialog::backdrop {
      background: rgba(10, 26, 22, .6)
    }

    .dg {
      padding: 30px
    }

    .dg h2 {
      font-size: 1.4rem;
      margin-bottom: 4px
    }

    .dg .sub {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: .95rem
    }

    .target {
      background: #E3EFEA;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-weight: 500
    }

    .fld {
      display: grid;
      gap: 6px;
      margin-bottom: 14px
    }

    .fld label {
      font-weight: 500;
      font-size: .92rem
    }

    .fld input {
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      font: 400 1rem var(--f);
      width: 100%
    }

    .fld input:focus {
      outline: none;
      border-color: var(--board)
    }

    .msg {
      color: var(--err);
      font-size: .92rem;
      min-height: 1.3em;
      margin-bottom: 6px
    }

    .ok-box {
      text-align: center;
      padding: 12px 0
    }

    .ok-box i {
      font-size: 3rem;
      color: var(--ok);
      margin-bottom: 12px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 30px);
      background: var(--board);
      color: #fff;
      padding: 13px 22px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 90;
      font-weight: 500
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 26px 0;
      color: var(--muted);
      font-size: .92rem
    }

    @media(max-width:860px) {

      .cycles,
      .how {
        grid-template-columns: 1fr
      }

      .cycles {
        margin-top: -60px
      }

      .search {
        display: none
      }

      .bar {
        justify-content: space-between
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }

      html {
        scroll-behavior: auto
      }
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="wrap bar">
      <button class="logo" id="logo" aria-label="Retour à l'accueil"><i class="fa-solid fa-book-open-reader"></i>
        CoursEnLigne</button>
      <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search"
          placeholder="Cherche un cours : maths terminale C, droit L1…" aria-label="Rechercher un cours"
          autocomplete="off"></label>
      <button class="mine" id="mineBtn"><i class="fa-solid fa-bookmark"></i> Mes cours <b id="mineN">0</b></button>
    </div>
  </header>

  <div id="heroZone"></div>
  <main>
    <div class="wrap" id="view"></div>
  </main>
  <footer>
    <div class="wrap">© <span id="yr"></span> CoursEnLigne. Programmes indicatifs, à compléter avec les consignes de ton
      établissement.</div>
  </footer>

  <div class="veil" id="veil"></div>
  <aside class="panel" id="panel" aria-hidden="true"></aside>
  <dialog id="dlg"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = s => document.querySelector(s);
    const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
    const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } };
    const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    /* =========================================================
       MATIÈRES
       ========================================================= */
    const SUBJ = {
      maths: ['Mathématiques', 'fa-square-root-variable'], fr: ['Français', 'fa-book'], ang: ['Anglais', 'fa-language'],
      hist: ['Histoire', 'fa-landmark'], geo: ['Géographie', 'fa-earth-africa'], ecm: ['Éducation à la citoyenneté et à la morale', 'fa-scale-balanced'],

      chi: ['Chimie', 'fa-flask'], info: ['Informatique', 'fa-laptop-code'], philo: ['Philosophie', 'fa-brain'], lit: ['Littérature et Français', 'fa-feather'],
      esp: ['Espagnol', 'fa-language'], all: ['Allemand', 'fa-language'], tec: ['Technologie industrielle', 'fa-gears'],
      mec: ['Construction mécanique', 'fa-gears'], dess: ['Dessin industriel', 'fa-pen-ruler'], fab: ['Fabrication mécanique', 'fa-industry'],

      bat: ['Technologie du bâtiment', 'fa-building'], beton: ['Béton armé', 'fa-trowel-bricks'], topo: ['Topographie', 'fa-compass-drafting'],
      droit: ['Droit', 'fa-gavel'], eco: ['Économie', 'fa-chart-line'], bur: ['Bureautique et secrétariat', 'fa-keyboard'], comm: ['Communication', 'fa-comments'],
      compta: ['Comptabilité', 'fa-calculator'], mfin: ['Mathématiques financières', 'fa-percent'], tcom: ['Techniques commerciales', 'fa-handshake'], mark: ['Marketing', 'fa-bullhorn']
    };
    const LBL = { '6': '6ème', '5': '5ème', '4': '4ème', '3': '3ème', '2': '2nde', '1': '1ère', 'T': 'Terminale' };

    /* Chapitres : clé = matière + niveau (+ groupe de série). "*" = valable pour plusieurs niveaux. */
    const CH = {
      maths6: "Nombres entiers et décimaux|Opérations et priorités|Fractions simples|Proportionnalité|Droites, angles et triangles|Périmètres et aires|Statistiques simples",
      maths5: "Nombres relatifs|Fractions et opérations|Calcul littéral|Symétrie centrale et parallélogrammes|Triangles et angles|Aires et volumes|Organisation des données",
      maths4: "Puissances et racines carrées|Calcul littéral et équations|Théorème de Pythagore|Initiation au théorème de Thalès|Vecteurs et translations|Fonctions linéaires|Statistiques",
      maths3: "Équations et inéquations|Systèmes d'équations|Théorème de Thalès|Trigonométrie|Fonctions affines|Vecteurs et repérage|Probabilités et statistiques",
      maths2: "Ensembles et logique|Calcul algébrique|Équations, inéquations et systèmes|Fonctions numériques|Géométrie plane et vecteurs|Trigonométrie|Statistiques",
      maths1S: "Second degré|Dérivation|Suites numériques|Trigonométrie|Produit scalaire|Dénombrement et probabilités|Statistiques",
      maths1D: "Second degré|Dérivation et étude de fonctions|Suites arithmétiques et géométriques|Dénombrement|Probabilités|Statistiques|Géométrie dans l'espace",

    ];

    /* =========================================================
       CONSTRUCTION DES COURS
       ========================================================= */
    const CY = {
      col: { n: 'Collège', c: '#2459D6', i: 'fa-school', d: 'De la 6ème à la 3ème, avec préparation au BEPC' },
      lyc: { n: 'Lycée', c: '#B84A14', i: 'fa-building-columns', d: '2nde, 1ère et Terminale : toutes les séries' },
      uni: { n: 'Université', c: '#6D3FD6', i: 'fa-graduation-cap', d: 'Licence 1 à 3 : toutes les filières' }
    };
    const mk = (id, title, icon, sub, topics, cy) => ({ id, title, icon, sub, topics, cy });
    const colC = (lvl, s) => mk(`c|${lvl}|${s}`, SUBJ[s][0], SUBJ[s][1], LBL[lvl], ch(s, lvl, ''), 'col');
    const lycC = (lvl, serie, s) => mk(`l|${lvl}|${serie}|${s}`, SUBJ[s][0], SUBJ[s][1], lvl === '2' ? '2nde' : `${LBL[lvl]} · Série ${serie}`, ch(s, lvl, serie), 'lyc');
    const filById = id => FIL.find(f => f[0] === id);
    function uniC(fid, y, i) {
      const f = filById(fid), ue = f[3][y - 1].split('|')[i], [t, tp] = ue.split(': ');
      return mk(`u|${fid}|${y}|${i}`, t, f[2], `${f[1]} · Licence ${y}`, tp.split(', '), 'uni');
    }
    const colList = lvl => COL[lvl].map(s => colC(lvl, s));
    const lycList = (lvl, serie) => lvl === '2' ? L2.map(s => lycC('2', '', s)) : SER[serie][1].filter(s => !(s === 'philo' && lvl !== 'T')).map(s => lycC(lvl, serie, s));
    const uniList = (fid, y) => filById(fid)[3][y - 1].split('|').map((_, i) => uniC(fid, y, i));

    function byId(id) {
      const p = id.split('|');
      if (p[0] === 'c') return colC(p[1], p[2]);
      if (p[0] === 'l') return lycC(p[1], p[2], p[3]);
      if (p[0] === 'u') return uniC(p[1], +p[2], +p[3]);
    }
    let ALL = null;
    function allCourses() {
      if (ALL) return ALL;
      ALL = [];
      Object.keys(COL).forEach(l => ALL.push(...colList(l)));
      ALL.push(...lycList('2'));
      ['1', 'T'].forEach(l => Object.keys(SER).forEach(s => ALL.push(...lycList(l, s))));
      FIL.forEach(f => [1, 2, 3].forEach(y => ALL.push(...uniList(f[0], y))));
      return ALL;
    }

    /* =========================================================
       ÉTAT, PERSISTANCE
       ========================================================= */
    const S = { cy: null, lvl: null, serie: null, fil: null, year: null, q: '' };
    let enrolled = load('cel-enrolled', {});
    let prog = load('cel-prog', {});
    let profile = load('cel-profile', {});
    const done = c => (prog[c.id] || []).length;
    const pct = c => Math.round(done(c) / c.topics.length * 100);

    /* =========================================================
       VUES
       ========================================================= */
    const crumb = items => `<nav class="crumbs" aria-label="Fil d'Ariane">${items.map((it, i) =>
      i === items.length - 1 ? `<b>${it[0]}</b>` : `<button data-go='${JSON.stringify(it[1])}'>${it[0]}</button><span>›</span>`).join('')}</nav>`;

    const courseCard = c => {
      const e = enrolled[c.id], p = pct(c);
      return `<button class="course" style="--c:${CY[c.cy].c}" data-open="${c.id}">
    <span class="ic"><i class="fa-solid ${c.icon}"></i></span>
    <span><b>${c.title}</b><small>${c.sub}</small></span>
    ${e || p ? `<span class="pg"><span class="bar-p"><i style="width:${p}%"></i></span>${e ? `<span class="tick"><i class="fa-solid fa-check"></i> Inscrit · ${p}%</span>` : ''}</span>` : ''}</button>`;
    };
    const grid = list => `<div class="grid">${list.map(courseCard).join('')}</div>`;
    const pills = (items, cur, key, c) => `<div class="pills" style="--c:${c}">${items.map(([k, l]) => `<button class="pill ${cur === k ? 'on' : ''}" data-go='${JSON.stringify({ [key]: k, ...(key === 'lvl' ? { serie: null } : {}), ...(key === 'fil' ? { year: null } : {}) })}'>${l}</button>`).join('')}</div>`;

    function hero() {
      $('#heroZone').innerHTML = S.cy || S.q.trim().length >= 2 ? '' : `
  <section class="hero"><div class="wrap">
    <h1>Apprends à ton rythme, de la <em>6ème</em> à la <em>Licence 3</em>.</h1>
    <p>Choisis ta classe, ta série ou ta filière, ouvre un cours, coche les chapitres terminés et suis ta progression. Tout est gratuit et enregistré sur ton appareil.</p>
    <div class="stats"><div><b>${allCourses().length}</b>cours</div><div><b>12</b>séries au lycée</div><div><b>${FIL.length}</b>filières universitaires</div></div>
  </div></section>`;
    }

    function viewHome() {
      return `<div class="cycles" style="margin-top:-76px">${Object.entries(CY).map(([k, c]) => `
    <button class="cy" style="--c:${c.c}" data-go='{"cy":"${k}","lvl":null,"serie":null,"fil":null,"year":null}'>
      <span class="ic"><i class="fa-solid ${c.i}"></i></span><h2>${c.n}</h2><p>${c.d}</p>
      <span class="go">Choisir <i class="fa-solid fa-arrow-right"></i></span></button>`).join('')}</div>
    <div class="how">
      <div><i class="fa-solid fa-hand-pointer"></i><h3>1. Choisis ton niveau</h3><p>Classe, série ou filière : on te montre uniquement les cours qui te concernent.</p></div>
      <div><i class="fa-solid fa-list-check"></i><h3>2. Suis les chapitres</h3><p>Chaque cours affiche son programme. Coche les chapitres au fur et à mesure.</p></div>
      <div><i class="fa-solid fa-bookmark"></i><h3>3. Inscris-toi</h3><p>Retrouve tous tes cours et ta progression dans « Mes cours ».</p></div>
    </div>`;
    }

    function viewCol() {
      const c = CY.col.c;
      let h = crumb([['Accueil', { cy: null }], S.lvl ? [CY.col.n, { lvl: null }] : [CY.col.n], ...(S.lvl ? [[LBL[S.lvl]]] : [])]);
      h += `<div class="vh"><h2>Collège</h2><p>Choisis ta classe pour voir tes cours.</p></div>`;
      h += pills([['6', '6ème'], ['5', '5ème'], ['4', '4ème'], ['3', '3ème']], S.lvl, 'lvl', c);
      if (S.lvl) h += `<h3 class="step">Cours de ${LBL[S.lvl]}${S.lvl === '3' ? ' (préparation au BEPC)' : ''}</h3>` + grid(colList(S.lvl));
      return h;
    }

    function viewLyc() {
      const c = CY.lyc.c;
      let h = crumb([['Accueil', { cy: null }], S.lvl ? [CY.lyc.n, { lvl: null, serie: null }] : [CY.lyc.n], ...(S.lvl ? [[LBL[S.lvl]]] : [])]);
      h += `<div class="vh"><h2>Lycée</h2><p>Choisis ta classe, puis ta série à partir de la 1ère.</p></div>`;
      h += pills([['2', '2nde'], ['1', '1ère'], ['T', 'Terminale']], S.lvl, 'lvl', c);
      if (S.lvl === '2') h += `<h3 class="step">Cours de 2nde (tronc commun)</h3>` + grid(lycList('2'));
      if (S.lvl === '1' || S.lvl === 'T') {
        h += `<h3 class="step">Choisis ta série</h3>` + SER_GROUPS.map(([g, ids]) => `<div class="grp"><small>${g}</small><div class="chips" style="--c:${c}">${ids.map(id =>
          `<button class="chip ${S.serie === id ? 'on' : ''}" data-go='{"serie":"${id}"}'>${SER[id][0]}</button>`).join('')}</div></div>`).join('');
        if (S.serie) h += `<h3 class="step">${LBL[S.lvl]}, série ${SER[S.serie][0]}${S.lvl === '1' ? ' (préparation au Probatoire)' : ' (préparation au Baccalauréat)'}</h3>` + grid(lycList(S.lvl, S.serie));
      }
      return h;
    }

    function viewUni() {
      const c = CY.uni.c;
      const f = S.fil && filById(S.fil);
      let h = crumb([['Accueil', { cy: null }], f ? [CY.uni.n, { fil: null, year: null }] : [CY.uni.n], ...(f ? [[f[1]]] : [])]);
      h += `<div class="vh"><h2>Université</h2><p>${f ? f[1] : 'Choisis ta filière, puis ton année de Licence.'}</p></div>`;
      if (!f) return h + `<div class="grid" style="--c:${c}">${FIL.map(x => `<button class="fil" style="--c:${c}" data-go='{"fil":"${x[0]}","year":1}'><span class="ic"><i class="fa-solid ${x[2]}"></i></span><b>${x[1]}</b></button>`).join('')}</div>`;
      h += pills([[1, 'Licence 1'], [2, 'Licence 2'], [3, 'Licence 3']], S.year, 'year', c);
      if (S.year) h += `<h3 class="step">Unités d'enseignement, Licence ${S.year}</h3>` + grid(uniList(S.fil, S.year));
      return h;
    }

    function viewSearch() {
      const t = norm(S.q.trim()).split(/\s+/);
      const names = { col: 'collège', lyc: 'lycée', uni: 'université licence' };
      const res = allCourses().filter(c => { const hay = norm(`${c.title} ${c.sub} ${names[c.cy]} ${c.topics.join(' ')}`); return t.every(w => hay.includes(w)); });
      const shown = res.slice(0, 60);
      return `<div class="vh"><h2>Résultats pour « ${S.q.trim().replace(/[<>&]/g, '')} »</h2></div>
    <p class="count">${res.length} cours trouvé${res.length > 1 ? 's' : ''}${res.length > 60 ? ' (60 premiers affichés, précise ta recherche)' : ''}</p>` +
        (shown.length ? grid(shown) : `<div class="empty"><i class="fa-regular fa-face-frown" style="font-size:2rem"></i><p>Aucun cours trouvé. Essaie « maths 3ème », « droit L1 » ou « réseaux ».</p></div>`);
    }

    function render() {
      hero();
      const searching = S.q.trim().length >= 2;
      $('#view').innerHTML = searching ? viewSearch() : !S.cy ? viewHome() : S.cy === 'col' ? viewCol() : S.cy === 'lyc' ? viewLyc() : viewUni();
      $('#mineN').textContent = Object.keys(enrolled).length;
    }
    function go(p) { Object.assign(S, p); if (p.cy === null) { S.lvl = S.serie = S.fil = S.year = null; } $('#q').value = S.q = ''; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    /* =========================================================
       PANNEAU DE COURS
       ========================================================= */
    const panel = $('#panel'), veil = $('#veil');
    function showPanel(open) {
      panel.classList.toggle('on', open); veil.classList.toggle('on', open);
      panel.setAttribute('aria-hidden', !open); document.body.style.overflow = open ? 'hidden' : '';
    }
    function openCourse(id) {
      const c = byId(id); if (!c) return;
      const d = prog[id] || [], e = enrolled[id], p = pct(c);
      panel.dataset.cur = id;
      panel.style.setProperty('--c', CY[c.cy].c);
      panel.innerHTML = `<div class="ph"><button class="close" data-close aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button><small>${c.sub}</small><h2>${c.title}</h2></div>
    <div class="pb">
      <div class="pgl"><span>${d.length} chapitre${d.length > 1 ? 's' : ''} sur ${c.topics.length}</span><span>${p}%</span></div>
      <div class="bar-p"><i style="width:${p}%"></i></div>
      <ul class="chl">${c.topics.map((t, i) => `<li><label><input type="checkbox" data-ch="${i}" ${d.includes(i) ? 'checked' : ''}><span>${t}</span></label></li>`).join('')}</ul>
    </div>
    <div class="pf">${e ? `<button class="btn done" disabled><i class="fa-solid fa-circle-check"></i> Tu es inscrit à ce cours</button>` : `<button class="btn" data-enroll="${id}"><i class="fa-solid fa-user-plus"></i> S'inscrire à ce cours</button>`}</div>`;
      showPanel(true);
    }
    function openMine() {
      const ids = Object.keys(enrolled);
      panel.dataset.cur = ''; panel.style.setProperty('--c', '#123B33');
      panel.innerHTML = `<div class="ph"><button class="close" data-close aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button><small>${ids.length} inscription${ids.length > 1 ? 's' : ''}</small><h2>Mes cours</h2></div>
    <div class="pb">${ids.length ? ids.map(id => { const c = byId(id); return `<div class="mi"><div><b>${c.title}</b><br><small>${c.sub}</small></div><button data-open="${id}">Ouvrir</button><div class="bar-p"><i style="width:${pct(c)}%"></i></div></div>`; }).join('')
          : `<div class="empty"><i class="fa-regular fa-bookmark" style="font-size:2rem"></i><p>Tu n'es inscrit à aucun cours pour le moment.</p></div>`}</div>`;
      showPanel(true);
    }
    function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); }

    /* Inscription */
    const dlg = $('#dlg');
    function openEnroll(id) {
      const c = byId(id);
      dlg.innerHTML = `<div class="dg"><h2>Inscription</h2><p class="sub">Renseigne tes informations pour t'inscrire.</p>
    <div class="target"><i class="fa-solid ${c.icon}"></i> ${c.title} · ${c.sub}</div>
    <form id="enForm" novalidate>
      <div class="fld"><label for="en">Nom complet</label><input id="en" autocomplete="name" value="${profile.name || ''}"></div>
      <div class="fld"><label for="ee">Adresse email</label><input id="ee" type="email" autocomplete="email" value="${profile.email || ''}"></div>
      <p class="msg" id="em" role="alert"></p>
      <button class="btn" type="submit">Confirmer mon inscription</button>
      <button class="btn ghost" type="button" id="ec" style="width:100%;margin-top:10px">Annuler</button>
    </form></div>`;
      dlg.showModal();
      $('#ec').onclick = () => dlg.close();
      $('#enForm').onsubmit = ev => {
        ev.preventDefault();
        const n = $('#en').value.trim(), m = $('#ee').value.trim();
        if (n.length < 3) return $('#em').textContent = 'Entre ton nom complet.';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return $('#em').textContent = 'Entre une adresse email valide.';
        profile = { name: n, email: m }; save('cel-profile', profile);
        enrolled[id] = { at: Date.now() }; save('cel-enrolled', enrolled);
        dlg.innerHTML = `<div class="dg ok-box"><i class="fa-solid fa-circle-check"></i><h2>Bienvenue ${n.split(' ')[0]} !</h2><p class="sub">Tu es inscrit à « ${c.title} » (${c.sub}).<br>Retrouve-le dans « Mes cours ».</p><button class="btn" id="eo">Commencer le cours</button></div>`;
        $('#eo').onclick = () => { dlg.close(); openCourse(id); };
        render();
      };
    }
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

    /* =========================================================
       ÉVÉNEMENTS
       ========================================================= */
    document.addEventListener('click', e => {
      const g = e.target.closest('[data-go]'); if (g) { go(JSON.parse(g.dataset.go)); return; }
      const o = e.target.closest('[data-open]'); if (o) { openCourse(o.dataset.open); return; }
      const en = e.target.closest('[data-enroll]'); if (en) { openEnroll(en.dataset.enroll); return; }
      if (e.target.closest('[data-close]') || e.target === veil) showPanel(false);
    });
    panel.addEventListener('change', e => {
      const cb = e.target.closest('[data-ch]'); if (!cb) return;
      const id = panel.dataset.cur, set = new Set(prog[id] || []), i = +cb.dataset.ch;
      cb.checked ? set.add(i) : set.delete(i);
      prog[id] = [...set]; save('cel-prog', prog);
      const c = byId(id), p = pct(c);
      panel.querySelector('.pgl').innerHTML = `<span>${set.size} chapitre${set.size > 1 ? 's' : ''} sur ${c.topics.length}</span><span>${p}%</span>`;
      panel.querySelector('.pb .bar-p i').style.width = p + '%';
      if (p === 100) toast('Bravo, cours terminé !');
      render();
    });
    $('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
    $('#logo').onclick = () => go({ cy: null });
    $('#mineBtn').onclick = openMine;
    document.addEventListener('keydown', e => { if (e.key === 'Escape') showPanel(false); });

    $('#yr').textContent = new Date().getFullYear();
    render();
  </script>
</body>

</html>
